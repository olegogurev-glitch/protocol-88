<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocol 88">
<link rel="manifest" href="manifest.webmanifest">
<title>Protocol 88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&family=Tektur:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; cursor: none; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ---- boot console: "PROTOCOL NUMBER" prompt before the title screen */
  #boot { position: fixed; inset: 0; z-index: 10; background: #000; overflow: hidden; touch-action: none; transition: opacity .45s ease .25s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot.hidden { display: none; }
  .bootScreen {
    position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%) rotate(0deg);
    box-sizing: border-box; padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    font-family: "Press Start 2P", "Courier New", monospace; color: #5affc8;
    font-size: clamp(9px, 2.6vmin, 15px); line-height: 2.1;
    text-shadow: 0 0 6px rgba(90,255,200,.65), 0 0 18px rgba(90,255,200,.25);
    background: radial-gradient(ellipse at center, #031a14 0%, #010805 62%, #000 100%);
    transition: transform .9s cubic-bezier(.7,0,.25,1), width .9s cubic-bezier(.7,0,.25,1), height .9s cubic-bezier(.7,0,.25,1);
    animation: flicker 4s infinite steps(1);
  }
  .bootScreen.rot { transform: translate(-50%, -50%) rotate(90deg); } /* width/height swapped from JS */
  .bootScreen.snap { transition: none; }
  .bootScreen.off { animation: crtOff .55s cubic-bezier(.6,0,.4,1) forwards; }
  .bootScreen::before { /* scanlines */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
  }
  .bootScreen::after { /* glass vignette */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0,0,0,.9); border-radius: 18px;
  }
  .term { width: min(100%, 46em); margin: 0 auto; }
  #bootLog { margin: 0; white-space: pre-wrap; font: inherit; min-height: 1em; }
  #bootLog .dim { color: #2a9a78; text-shadow: none; }
  #bootLog .hot { color: #ffffff; text-shadow: 0 0 8px #5affc8, 0 0 22px #5affc8; }
  #bootLog .warn { color: #ffd23a; text-shadow: 0 0 8px rgba(255,210,58,.6); }
  .prompt { visibility: hidden; }
  .prompt.on { visibility: visible; }
  .caret { animation: blink 1s infinite steps(1); }
  .answer { display: flex; align-items: center; gap: 1.6em; margin-top: 1.6em; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; pointer-events: none; }
  .answer.on { opacity: 1; transform: none; pointer-events: auto; }
  #boot88 {
    font: inherit; font-size: 2.2em; line-height: 1; color: #001a12; background: #5affc8;
    border: 0; padding: .55em .7em .5em; cursor: pointer; letter-spacing: .08em;
    box-shadow: 0 0 0 3px #000, 0 0 0 5px #5affc8, 0 0 28px rgba(90,255,200,.7);
    animation: pulse 1.4s ease-in-out infinite; touch-action: manipulation;
  }
  #boot88:active, #boot88.hit { transform: scale(.94); background: #ffffff; }
  #boot88:focus-visible { outline: 3px dashed #ffd23a; outline-offset: 8px; }
  .answerHint { color: #2a9a78; text-shadow: none; font-size: .8em; line-height: 1.8; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 3px #000, 0 0 0 5px #5affc8, 0 0 46px rgba(90,255,200,1); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: .96; } 48% { opacity: 1; } 81% { opacity: .93; } 82% { opacity: 1; } }
  @keyframes crtOff {
    0% { filter: brightness(1); }
    35% { clip-path: inset(49.6% 0 49.6% 0); filter: brightness(3); }
    75% { clip-path: inset(49.6% 49.6% 49.6% 49.6%); filter: brightness(4); }
    100% { clip-path: inset(50% 50% 50% 50%); filter: brightness(4); opacity: 0; }
  }

  /* ---- shown on touch devices held upright after boot */
  #rotate {
    position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: rgba(2,1,8,.94); color: #5affc8; font: 12px/2 "Press Start 2P", monospace; text-align: center; letter-spacing: .05em;
    text-shadow: 0 0 8px rgba(90,255,200,.6);
  }
  #rotate.on { display: flex; }
  #rotate .phone { width: 46px; height: 80px; border: 4px solid #5affc8; border-radius: 9px; box-shadow: 0 0 18px rgba(90,255,200,.5); position: relative; animation: turn 2.2s cubic-bezier(.7,0,.3,1) infinite; }
  #rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 12px; height: 3px; margin-left: -6px; background: #5affc8; border-radius: 2px; }
  #rotate small { color: #8a8ab0; font-size: 9px; text-shadow: none; }
  @keyframes turn { 0%, 20% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) {
    .bootScreen { animation: none; transition-duration: .01s; }
    #rotate .phone { animation: none; transform: rotate(-90deg); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="boot" role="dialog" aria-label="Protocol 88 boot console" data-i18n-label="Protocol 88 boot console">
  <div class="bootScreen" id="bootScreen">
    <div class="term">
      <pre id="bootLog"></pre>
      <div class="prompt" id="bootPrompt"><span data-i18n="&gt; PROTOCOL NUMBER:">&gt; PROTOCOL NUMBER:</span> <span id="bootInput"></span><span class="caret" id="bootCaret">_</span></div>
      <div class="answer" id="bootAnswer">
        <button id="boot88" type="button" aria-label="Answer 88" data-i18n-label="Answer 88">88</button>
        <div class="answerHint" id="bootHint"></div>
      </div>
    </div>
  </div>
</div>
<div id="rotate" aria-live="polite"><div class="phone"></div><div data-i18n="ROTATE DEVICE">ROTATE DEVICE</div><small data-i18n="PROTOCOL 88 RUNS IN LANDSCAPE">PROTOCOL 88 RUNS IN LANDSCAPE</small></div>
<script src="js/audio.js?v=16"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/game.js?v=32"></script>
</body>
</html>
